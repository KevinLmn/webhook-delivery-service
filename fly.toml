app = "vitrine-webhook-demo"
primary_region = "cdg"

[build]
  dockerfile = "docker/Dockerfile"

[deploy]
  release_command = "pnpm --filter @vitrine/db push --force"

[processes]
  api = "pnpm --filter @vitrine/api start"
  worker = "pnpm --filter @vitrine/worker start"

[env]
  LOG_LEVEL = "info"
  NODE_ENV = "production"
  PORT = "3000"

[[services]]
  processes = ["api"]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "256mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
